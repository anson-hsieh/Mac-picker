<style>
  :root{
    color-scheme:light;
    --bg:#f5f5f7; --card:#fff; --text:#1d1d1f; --sub:#6e6e73; --line:#d2d2d7;

  }
  /* 手動選擇深色 */
  :root[data-theme="dark"]{
    color-scheme:dark;
    --bg:#000; --card:#1c1c1e; --text:#f5f5f7; --sub:#a1a1a6; --line:#3a3a3c; --accent:#2997ff; --accent-soft:#0b2540; --ok:#30d158; --warn:#ffb454;

  .theme-btn:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang TC","Noto Sans TC",sans-serif;line-height:1.5}

  section.panel{background:var(--card);border-radius:var(--radius);padding:24px;margin-bottom:20px}
  h2{font-size:20px;margin:0 0 4px}
  .hint{color:var(--sub);font-size:14px;margin:0 0 16px}
  fieldset{border:0;margin:0 0 8px;padding:0}
  legend{font-size:13px;font-weight:600;color:var(--sub);margin:12px 0 8px;padding:0}
  .chips{display:flex;flex-wrap:wrap;gap:10px}
  .chip{position:relative}
  .chip input{position:absolute;opacity:0;top:0;left:0;width:100%;height:100%;margin:0;cursor:pointer}
  .chip label{display:flex;align-items:center;gap:8px;padding:10px 16px;border:1.5px solid var(--line);
    border-radius:999px;font-size:15px;cursor:pointer;transition:.15s;user-select:none}
  .chip input:hover + label{border-color:var(--accent)}
  .chip input:checked + label{background:var(--accent);border-color:var(--accent);color:#fff}
  .chip input:focus-visible + label{outline:3px solid var(--accent);outline-offset:2px}
  .seg{display:inline-flex;background:var(--bg);border-radius:10px;padding:3px}
  .seg .chip label{border:0;border-radius:8px;padding:7px 16px;font-size:14px}
  .seg .chip input:checked + label{background:var(--card);color:var(--text);box-shadow:0 1px 4px rgba(0,0,0,.2)}
  .toolbar{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px}
  button.reset{background:none;border:1px solid var(--line);color:var(--sub);border-radius:999px;padding:7px 16px;cursor:pointer;font-size:14px}
  button.reset:hover{color:var(--text);border-color:var(--text)}

  #result{scroll-margin-top:20px}
  .empty{text-align:center;color:var(--sub);padding:48px 16px}
  .empty .big{font-size:48px}
  .main{background:linear-gradient(135deg,var(--accent-soft),var(--card));border:1.5px solid var(--accent);
    border-radius:var(--radius);padding:28px;animation:pop .35s ease}
  @keyframes pop{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  @media (prefers-reduced-motion:reduce){.main{animation:none}}
  .badge{display:inline-block;background:var(--accent);color:#fff;font-size:12px;padding:3px 10px;border-radius:999px;margin-bottom:10px}
  .main h3{font-size:clamp(24px,4vw,34px);margin:0 0 4px}
  .tagline{color:var(--sub);margin:0 0 20px}
  .specs{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:20px}
  .spec{background:var(--card);border-radius:12px;padding:12px 14px}

  .meter-label{display:flex;justify-content:space-between;font-size:12px;color:var(--sub);margin-bottom:20px}

  .duo-card ul{margin:0 0 10px;padding-left:18px;font-size:14px}
  .duo-card small{color:var(--sub);font-size:12px}
  .tag{display:inline-block;font-size:12px;padding:2px 10px;border-radius:999px;background:var(--ok);color:#fff}
  .tag.b{background:var(--accent)}
  .price{margin:10px 0}

  .price span{color:var(--sub);font-size:13px}
  .price small{display:block;color:var(--sub);font-size:12px;line-height:1.4;margin-top:2px}
  .price em{display:block;font-style:normal;font-size:12px;color:var(--warn);margin-top:4px}
  .confirm-bar{text-align:center;margin:0 0 20px}
  .confirm-btn{font:inherit;font-size:17px;font-weight:600;cursor:pointer;color:#fff;
    background:var(--accent);border:0;border-radius:999px;padding:14px 36px;transition:.15s;

  .confirm-btn:disabled{background:var(--line);color:var(--sub);cursor:not-allowed;box-shadow:none}
  .confirm-hint{margin:10px 0 0;font-size:13px;color:var(--sub)}
  .price.big{background:var(--card);border-radius:12px;padding:14px 16px;margin:0 0 16px}
  .price.big b{font-size:30px;color:var(--accent)}
  .price.big small{font-size:13px}
  .alt{margin-top:20px}

  .alt-card{background:var(--card);border-radius:14px;padding:16px}

  {id:'desk',   name:'🖥️ 桌機'},
];
const RAM_STEPS = [8,16,24,32,48,64,96,128];
const STO_STEPS = [256,512,1024,2048];

/* ============ 畫面建立 ============ */
const $ = s => document.querySelector(s);
const state = {ids:new Set(), pref:'any'};
const ALL = [...SCENES.flatMap(g=>g.items), ...SOFTWARE.flatMap(g=>g.items)];

function chip(item, type, name){
  const d = document.createElement('div'); d.className='chip';
  d.innerHTML = `<input type="${type}" id="${name}-${item.id}" ${type==='radio'?`name="${name}"`:''} value="${item.id}">
                 <label for="${name}-${item.id}">${item.icon?item.icon+' ':''}${item.name}</label>`;
  return d;
}
SCENES.forEach(g => {
  const fs = document.createElement('fieldset');
  fs.innerHTML = `<legend>${g.group}</legend><div class="chips"></div>`;
  g.items.forEach(i => fs.querySelector('.chips').appendChild(chip(i,'checkbox','c')));
  $('#scenes').appendChild(fs);
});
SOFTWARE.forEach((g,gi) => {
  const fs = document.createElement('fieldset');
  fs.innerHTML = `<legend>${g.group}</legend><div class="chips"></div>`;
  g.items.forEach(i => fs.querySelector('.chips').appendChild(chip(i,'checkbox','c')));
  $('#software').appendChild(fs);
});
PREFS.forEach(p => {
  const c = chip(p,'radio','pref'); if(p.id===state.pref) c.querySelector('input').checked = true;
  $('#pref').appendChild(c);
});

/* 深色模式開關:預設一律為淺色,按下後固定為深色/淺色並記住 */
const themeBtn = $('#themeBtn');
const isDark = () => document.documentElement.dataset.theme === 'dark';
function paintThemeBtn(){
  const d = isDark();
  themeBtn.setAttribute('aria-pressed', String(d));
  themeBtn.textContent = d ? '☀️' : '🌙';   // 深色模式顯示太陽(點擊切回一般)、一般模式顯示月亮(點擊切到深色)
}
themeBtn.onclick = () => {
  const next = isDark() ? 'light' : 'dark';
  document.documentElement.dataset.theme = next;
  try{ localStorage.setItem('theme', next); }catch(e){}
  paintThemeBtn();
};
paintThemeBtn();

document.addEventListener('change', e => {
  const el = e.target;
  if(el.name==='pref') state.pref = el.value;
  else if((el.id||'').indexOf('c-')===0) el.checked ? state.ids.add(el.value) : state.ids.delete(el.value);
  paintConfirm();          // 只更新按鈕狀態,等按下確認才產生推薦
});
$('#reset').onclick = () => {
  state.ids.clear();
  document.querySelectorAll('input[type=checkbox]').forEach(i=>i.checked=false);
  $('#result').innerHTML = '';
  paintConfirm();
};

/* ============ 確認按鈕 ============ */
const confirmBtn = $('#confirmBtn'), confirmHint = $('#confirmHint');
function paintConfirm(){
  const n = state.ids.size;
  confirmBtn.disabled = n === 0;
  confirmHint.textContent = n === 0
    ? '請先從上方選擇至少一項使用需求或常用軟體'
    : `已選 ${n} 項,點擊上方按鈕產生推薦`;
}
confirmBtn.onclick = () => {
  render();
  // GA4 自訂事件:追蹤「產生推薦」被按幾次、使用者選了什麼、推薦了什麼
  try{
    const picked = [...state.ids];
    const r = recommend();
    const t = r ? TIERS[r.lvl] : null;
    const side = state.pref==='desk' ? 'desk' : 'laptop';
    const model = (t && t[side]) ? t[side].n : '';
    gtag('event', 'generate_recommendation', {
      store:          STORE_ID,
      selected_count: picked.length,
      selected_ids:   picked.join(','),
      pref:           state.pref,
      level:          r ? r.lvl : 0,
      ram_gb:         r ? r.ram : 0,
      storage_gb:     r ? r.sto : 0,
      recommended:    model,
    });
  }catch(e){}
  $('#result').scrollIntoView({behavior:'smooth', block:'start'});
};

/* ============ 推薦邏輯 ============ */
const roundUp = (v, steps) => steps.find(s=>s>=v) || steps[steps.length-1];

function recommend(){
  const picked = ALL.filter(i => state.ids.has(i.id));
  if(!picked.length) return null;
  const maxLvl = Math.max(...picked.map(i=>i.lvl));
  const heavy = picked.filter(i=>i.lvl>=4).length;
  const boosted = heavy>=3 && maxLvl<6;           // 同時有 3 項以上重度需求 → 升一級
  const lvl = Math.min(6, maxLvl + (boosted?1:0));
  const ram = roundUp(Math.max(...picked.map(i=>i.ram)) * (boosted?1.5:1), RAM_STEPS);
  const sto = roundUp(Math.max(...picked.map(i=>i.sto)), STO_STEPS);
  const deciders = picked.filter(i=>i.lvl===maxLvl);
  return {lvl, ram, sto, deciders, boosted, count:picked.length};
}

const fmtSto = g => g>=1024 ? (g/1024)+' TB' : g+' GB';
const nt = n => 'NT$ ' + n.toLocaleString('en-US');
const minPrice = cfgs => Math.min(...cfgs.map(x=>x.price));

/* 找出「符合建議記憶體+儲存空間」的最低價配置;若沒有則退而求其次並附註 */
function priceInfo(cfgs, ram, sto){
  const asc = [...cfgs].sort((a,b)=>a.price-b.price);
  let cfg = asc.find(x=>x.ram>=ram && x.sto>=sto);
  if(cfg) return {cfg, note:''};
  cfg = asc.find(x=>x.ram>=ram);
  if(cfg) return {cfg, note:`此配置儲存空間 ${fmtSto(cfg.sto)},低於建議的 ${fmtSto(sto)},可搭配外接 SSD 或洽官網選配`};
  cfg = [...cfgs].sort((a,b)=>b.ram-a.ram || b.price-a.price)[0];
  return {cfg, note:`價格表中此機型最高為 ${cfg.ram} GB,低於建議的 ${ram} GB,更高規格請至官網確認選配與價格`};
}
function cfgHtml(cfg, note=''){
  return `<div class="price"><b>${nt(cfg.price)}</b>
    <small>${cfg.label}<br>${cfg.ram} GB 記憶體 · ${fmtSto(cfg.sto)} 儲存空間</small>
    ${note ? `<em>⚠️ ${note}</em>` : ''}</div>`;
}
function priceBlock(cfgs, ram, sto){
  const {cfg, note} = priceInfo(cfgs, ram, sto);
  return cfgHtml(cfg, note);
}
function fromPrice(cfgs){
  const cfg = [...cfgs].sort((a,b)=>a.price-b.price)[0];
  return `<div class="price"><b>${nt(cfg.price)}</b> <span>起</span></div>`;
}

function render(){
  const out = $('#result');
  const r = recommend();
  if(!r){
    out.innerHTML = `<div class="panel empty"><div class="big">👆</div><p>請從上方選擇至少一項,推薦結果會顯示在這裡</p></div>`;
    return;
  }
  const t = TIERS[r.lvl];
  const side = state.pref==='desk' ? 'desk' : 'laptop';
  const oppSide = side==='desk' ? 'laptop' : 'desk';
  const primary = t[side];
  const nextTier = r.lvl<6 ? TIERS[r.lvl+1][side] : null;
  const pi = m => priceInfo(m.cfgs, r.ram, r.sto).cfg;
  // 右邊的推薦:再上一級(多一點餘裕)。
  // 已是最高級、或再上一級選到的配置與左邊相同(重複)時,改推另一種形態(筆電↔桌機)
  const topTier = !nextTier || pi(nextTier)===pi(primary);
  const second = topTier ? t[oppSide] : nextTier;
  const lower = TIERS[r.lvl-1];

  // 入門筆電用 Neo / Air 專屬雙推薦卡;其餘等級用通用雙推薦卡
  const special = r.lvl===1 && r.ram<=8 && side==='laptop';
  const title = special ? 'MacBook Neo 或 MacBook Air' : `${primary.n} 或 ${second.n}`;
  const tagline = special
    ? '你的需求偏輕量,這兩款都能勝任,依預算與使用習慣挑選即可'
    : (topTier ? '兩個選擇都能滿足你,依使用習慣(筆電或桌機)挑選即可'
               : '左邊剛好夠用,右邊多一點餘裕、能用得更久,依預算與使用年限選擇');

  const priceOf = m => pi(m).price;
  const genCard = (tag, cls, m, extra='') => `
      <div class="duo-card">
        <span class="tag ${cls}">${tag}</span>
        <b>${m.n}</b>
        <p>${m.t}</p>
        ${priceBlock(m.cfgs, r.ram, r.sto)}
        ${extra}
      </div>`;
  const diff = priceOf(second) - priceOf(primary);
  const diffTxt = topTier ? ''
    : diff>=0 ? `<small>比左邊多 ${nt(diff)},換取更高效能與餘裕</small>`
              : `<small>效能更高但價格較低,因為不含螢幕、鍵盤與滑鼠(需另購)</small>`;
  const genHtml = `
    <div class="duo">
      ${genCard('剛好夠用', '', primary)}
      ${genCard(topTier ? '另一種形態' : '更有餘裕', 'b', second, diffTxt)}
    </div>`;
  const duoHtml = `
    <div class="duo">
      <div class="duo-card">
        <span class="tag">預算首選</span>
        <b>MacBook Neo</b>
        <p>最平價的 Mac,上網、文書、追劇、雲端 AI(ChatGPT、Claude)和輕量遊戲都夠用;大型 3D 遊戲不建議</p>
        <ul>
          <li>13 吋 · A18 Pro 晶片</li>
          <li>8 GB 記憶體 · 256 GB 起</li>
          <li>電池最長 16 小時</li>
        </ul>
        ${priceBlock(NEO, r.ram, r.sto)}
        <small>適合:學生、輕量文書、第二台備用機</small>
      </div>
      <div class="duo-card">
        <span class="tag b">彈性更大</span>
        <b>MacBook Air</b>
        <p>16 GB 起的記憶體,多工更從容,也能用得更久</p>
        <ul>
          <li>13.6 / 15.3 吋 · M5 晶片</li>
          <li>16 GB 起 · 512 GB 起</li>
          <li>電池最長 18 小時</li>
        </ul>
        ${priceBlock(AIR13, 16, r.sto)}
        ${priceBlock(AIR15, 16, r.sto)}
        <small>適合:開很多分頁/視窗、想用得更久、偶爾輕度創作</small>
      </div>
    </div>`;
  const meter = [1,2,3,4,5,6].map(n=>`<i class="${n<=r.lvl?'on':''}"></i>`).join('');
  // 其他選擇:另一種形態(旗艦等級已在雙推薦中)與較省預算的選項
  const alts = [
    !topTier ? `<div class="alt-card"><small>${oppSide==='desk' ? '想要桌機' : '想要可攜帶'}</small><b>${t[oppSide].n}</b><p>${t[oppSide].t}</p>${priceBlock(t[oppSide].cfgs, r.ram, r.sto)}</div>` : '',
    r.lvl>1 ? `<div class="alt-card"><small>預算有限時(效能略降)</small><b>${lower[side].n}</b><p>日常沒問題,但重度工作時可能感到吃力</p>${fromPrice(lower[side].cfgs)}</div>` : '',
  ].join('');

  out.innerHTML = `
  <div class="main" id="mainCard">
    <span class="badge">雙推薦 · 已選 ${r.count} 項</span>
    <h3>${title}</h3>
    <p class="tagline">${tagline}</p>

    <div class="meter" role="img" aria-label="效能等級 ${r.lvl} / 6:${t.name}">${meter}</div>
    <div class="meter-label"><span>入門</span><span>效能等級:<b>${t.name}</b></span><span>旗艦</span></div>

    <div class="specs">
      <div class="spec"><small>建議記憶體</small><b>${r.ram} GB 以上</b></div>
      <div class="spec"><small>建議儲存空間</small><b>${fmtSto(r.sto)} 以上</b></div>
      <div class="spec"><small>效能等級</small><b>${r.lvl} / 6 · ${t.name}</b></div>
    </div>

    ${special ? duoHtml : genHtml}

    <div class="why">
      <h4>為什麼這樣推薦?</h4>
      <ul>
        <li>你的需求中最吃效能的是:<b>${r.deciders.map(i=>i.name).join('、')}</b></li>
        ${r.boosted ? '<li>你同時有多項重度需求,因此<b>額外提升一級</b>並加大記憶體,以確保多工順暢</li>' : ''}
        <li>記憶體與儲存空間購買後<b>無法自行升級</b>,建議一次配足</li>
      </ul>
      ${r.lvl===1 ? '<p class="note">✅ 你的需求偏輕量,不需要為用不到的效能多花錢。</p>' : ''}
    </div>

    <div class="alt"><h4>其他選擇</h4><div class="alt-grid">${alts}</div></div>
  </div>`;
}
paintConfirm();
</script>
</body>
</html>
